import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java-library'
    id 'distribution'
    id 'maven-publish'
    id 'org.gradlex.extra-java-module-info' version '1.+'
}

group = 'org.citydb'

ext {
    citydbVersion = '1.5.0-SNAPSHOT'
    githubUrl = 'https://github.com/3dcitydb/citydb-oracle-adapter'
    gitConnection = githubUrl + '.git'
}

version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileJava') {
    options.javaModuleVersion = provider { project.version }
    options.encoding = 'UTF-8'
}

// When running the modular adapter from Gradle's exploded output, classes and
// resources live in separate directories (build/classes/java/main vs.
// build/resources/main). In JPMS, Class.getResourceAsStream on a named module
// only searches that module's own root, so resources in the separate directory
// (e.g. query_feature_hierarchy.sql) are not found and return null. Merging the
// resources into the classes directory keeps the whole module in one root.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory

repositories {
    maven {
        url = 'https://repo.osgeo.org/repository/release/'
    }
    maven {
        url = 'https://3dcitydb.org/maven'
    }
    mavenCentral()
}

configurations {
    // resolves the original jars, not the copies patched by extra-java-module-info
    thirdPartyLibs {
        canBeConsumed = false
        extendsFrom implementation, runtimeOnly
    }
}

dependencies {
    compileOnly "org.citydb:citydb-database:${citydbVersion}"

    implementation 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'
    implementation 'com.oracle.database.spatial:sdoapi:23.26'
    implementation 'com.oracle.database.spatial:sdoutl:23.26'

    testImplementation "org.citydb:citydb-cli:${citydbVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Run the citydb CLI in-process with the Oracle adapter on the classpath.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.citydb.database.oracle.cli.OracleCliLauncher'
}

extraJavaModuleInfo {
    failOnMissingModuleInfo = false
    deriveAutomaticModuleNamesFromFileNames = true
    // Gradle misses the Automatic-Module-Name of these jars because their manifest
    // is not the first entry, so repeat the names the JVM sees at runtime
    automaticModule('com.oracle.database.spatial:sdoapi', 'com.oracle.spatial.geometry')
    automaticModule('com.oracle.database.spatial:sdoutl', 'com.oracle.spatial.util')
}

distributions.main.contents {
    from('resources/license/LICENSE.txt') {
        filter(ReplaceTokens, tokens: [name: project.name])
    }
    from tasks.named('jar')
    from configurations.thirdPartyLibs
}

tasks.register('bundleMavenZip', Zip) {
    group = distZip.group
    archiveFileName = "${project.name}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('maven')
    from installDist
}

publishing {
    publications {
        mavenZip(MavenPublication) {
            artifact tasks.named('bundleMavenZip')
            pom {
                name = project.name
                url = githubUrl
                scm {
                    url = githubUrl
                    connection = 'scm:git:' + gitConnection
                }
            }
        }
    }
    repositories {
        maven {
            url = project.hasProperty('gitLab_maven_url') ?
                    project.property('gitLab_maven_url') :
                    System.getenv('GITLAB_MAVEN_URL')
            name = 'gitlab-maven'
            credentials(HttpHeaderCredentials) {
                name = 'Private-Token'
                value = project.hasProperty('gitLab_private_token') ?
                        project.property('gitLab_private_token') :
                        System.getenv('GITLAB_PRIVATE_TOKEN')
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}
